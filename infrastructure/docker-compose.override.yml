# =============================================================================
# Development Overrides
# =============================================================================
# This file is automatically loaded by docker compose in development.
# For production, use: docker compose -f docker-compose.yml up
#
# Features:
# - Volume mounts for live code reloading
# - Debug logging
# - Exposed ports for direct service access
# - Hot reload via watchdog
# =============================================================================

version: '3.8'

services:
  api:
    build:
      context: ..
      target: runtime
    volumes:
      # Mount source code for live reloading
      - ../api.py:/app/api.py:ro
      - ../cli.py:/app/cli.py:ro
      - ../wsgi.py:/app/wsgi.py:ro
      - ../gm_agent:/app/gm_agent:ro
      # Mount local campaigns for testing
      - ../data/campaigns:/data/campaigns
      # RAG search database
      - ../data:/data/rag:ro
    environment:
      - FLASK_DEBUG=1
      - LOG_LEVEL=DEBUG
    ports:
      - "127.0.0.1:5000:5000"  # Direct API access for debugging
    # Use Flask dev server with auto-reload
    command: >
      python -m flask run
      --host=0.0.0.0
      --port=5000
      --reload
      --debugger

  celery-worker:
    volumes:
      # Mount source code for live reloading
      - ../gm_agent:/app/gm_agent:ro
      # Mount local campaigns for testing
      - ../data/campaigns:/data/campaigns
      # RAG search database
      - ../data:/data/rag:ro
    environment:
      - LOG_LEVEL=DEBUG
    # Auto-reload on code changes
    command: >
      watchmedo auto-restart
      --directory=/app/gm_agent
      --pattern=*.py
      --recursive
      --
      celery -A gm_agent.tasks worker
      --loglevel=debug
      --concurrency=2
      --pool=prefork

  redis:
    ports:
      - "127.0.0.1:6379:6379"  # Direct Redis access for debugging

  chat-ui:
    volumes:
      - ../chat_ui.py:/app/chat_ui.py:ro
      - ../gm_agent:/app/gm_agent:ro
      - ../data:/data/rag:ro
      - ../data/chat_feedback.jsonl:/data/chat_feedback.jsonl
    environment:
      - LOG_LEVEL=DEBUG
      - FEEDBACK_LOG_PATH=/data/chat_feedback.jsonl
    ports:
      - "127.0.0.1:5001:5001"  # Direct access for debugging

  ngrok:
    ports:
      - "4040:4040"  # ngrok web inspector UI

  cli:
    volumes:
      - ../cli.py:/app/cli.py:ro
      - ../gm_agent:/app/gm_agent:ro
      - ../data/campaigns:/data/campaigns
      - ../data:/data/rag:ro
